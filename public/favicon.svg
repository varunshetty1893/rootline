<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="rootline-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C4B3C" />
      <stop offset="100%" stop-color="#14372C" />
    </linearGradient>
  </defs>
  <!-- Background rounded pill -->
  <rect width="32" height="32" rx="7" fill="url(#rootline-grad)" />
  <!-- Tree / Branch glyph -->
  <g fill="none" stroke="#F7F5F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main trunk -->
    <line x1="9" y1="24" x2="9" y2="8" />
    <!-- Branch curve -->
    <path d="M 9 17 C 9 12, 14 11, 23 11" />
    <!-- Child branch -->
    <path d="M 16 12 C 16 17, 19 19, 23 19" />
  </g>
  <!-- Nodes -->
  <circle cx="9" cy="8" r="2.2" fill="#E7B968" stroke="#1C4B3C" stroke-width="1.2" />
  <circle cx="9" cy="24" r="2.2" fill="#F7F5F0" stroke="#1C4B3C" stroke-width="1.2" />
  <circle cx="23" cy="11" r="2.2" fill="#E7B968" stroke="#1C4B3C" stroke-width="1.2" />
  <circle cx="23" cy="19" r="2.2" fill="#F7F5F0" stroke="#1C4B3C" stroke-width="1.2" />
</svg>
